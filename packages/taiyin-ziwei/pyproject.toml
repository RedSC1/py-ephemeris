[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "py-ephemeris-ziwei"
version = "1.0.0b7"
description = "Ziwei Doushu extension bindings for Taiyin Ephemeris"
readme = "README.md"
requires-python = ">=3.9"
license = "MPL-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "RedSC1" }]
dependencies = ["py-ephemeris>=1.0.0b7,<2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/RedSC1/py-ephemeris"
Repository = "https://github.com/RedSC1/py-ephemeris"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/taiyin_ziwei"]

[tool.pytest.ini_options]
testpaths = ["tests"]
