name: Release Python distributions to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: pypi-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Match package versions to tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          roots = [
              pathlib.Path("pyproject.toml"),
              pathlib.Path("packages/taiyin-bazi/pyproject.toml"),
          ]
          versions = [
              tomllib.loads(path.read_text(encoding="utf-8"))["project"]["version"]
              for path in roots
          ]
          if len(set(versions)) != 1:
              raise SystemExit(f"package versions differ: {versions}")
          expected_tag = f"v{versions[0]}"
          if os.environ["RELEASE_TAG"] != expected_tag:
              raise SystemExit(
                  f"release tag {os.environ['RELEASE_TAG']!r} does not match "
                  f"package version; expected {expected_tag!r}"
              )
          print(f"validated release {expected_tag}")
          PY

  wheels:
    name: Wheels (${{ matrix.os }})
    needs: validate-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
          - macos-15-intel
          - macos-14
    env:
      CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
      CIBW_SKIP: "*-musllinux_* *-win32"
      CIBW_ARCHS: auto64
      CIBW_CONFIG_SETTINGS: >-
        cmake.define.TAIYIN_SOURCE_DIR={project}/taiyin-ephemeris

    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out pinned Taiyin C++ core
        uses: actions/checkout@v6
        with:
          repository: RedSC1/taiyin-ephemeris
          # Public v1.0.0-preview.1 commit; do not follow a moving branch.
          ref: 8bc7580ccd51bd9f1154bd077cfdd23316e69670
          path: taiyin-ephemeris
          persist-credentials: false

      - name: Set up host Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build and test py-ephemeris wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_TEST_COMMAND: >-
            python -c "import math, taiyin;
            eph = taiyin.Ephemeris();
            ctx = eph.create_context();
            jd = taiyin.JulianDate.from_double(2460310.5);
            row = ctx.position.at_ut1(taiyin.Body.mars, jd);
            assert math.isfinite(row[0])"
        with:
          package-dir: .
          output-dir: wheelhouse/core

      - name: Build and test py-ephemeris-bazi wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_CONFIG_SETTINGS: >-
            cmake.define.TAIYIN_SOURCE_DIR=../../taiyin-ephemeris
          CIBW_BEFORE_TEST: >-
            python -m pip install --no-index
            --find-links "{project}/wheelhouse/core" py-ephemeris
          CIBW_TEST_COMMAND: >-
            python -c "import taiyin, taiyin_bazi;
            eph = taiyin.Ephemeris();
            ctx = eph.create_context();
            bazi = ctx.bazi();
            local = taiyin.AstroDateTime(2003, 3, 13, 14, 15);
            result = bazi.calculate_local(
            local, gender=taiyin_bazi.BaziGender.male);
            assert type(ctx).__name__ == 'EphemerisContext';
            assert type(bazi).__name__ == 'BaziContext';
            assert result.qiyun.startAgeYears > 0"
        with:
          package-dir: packages/taiyin-bazi
          output-dir: wheelhouse/bazi

      - name: Verify py-ephemeris-bazi stays a thin extension
        run: >-
          python -c "import pathlib, zipfile;
          wheel = next(pathlib.Path('wheelhouse/bazi').glob('*.whl'));
          names = zipfile.ZipFile(wheel).namelist();
          assert wheel.stat().st_size < 1500000, wheel.stat().st_size;
          assert not any(name.startswith('taiyin/') for name in names), names"

      - name: Upload py-ephemeris wheels
        uses: actions/upload-artifact@v6
        with:
          name: core-wheels-${{ matrix.os }}
          path: wheelhouse/core/*.whl
          if-no-files-found: error
          retention-days: 14

      - name: Upload py-ephemeris-bazi wheels
        uses: actions/upload-artifact@v6
        with:
          name: bazi-wheels-${{ matrix.os }}
          path: wheelhouse/bazi/*.whl
          if-no-files-found: error
          retention-days: 14

  source-distributions:
    name: Source distributions
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build source distributions
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --outdir dist/core .
          python -m build --sdist --outdir dist/bazi packages/taiyin-bazi

      - name: Upload py-ephemeris source distribution
        uses: actions/upload-artifact@v6
        with:
          name: core-sdist
          path: dist/core/*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload py-ephemeris-bazi source distribution
        uses: actions/upload-artifact@v6
        with:
          name: bazi-sdist
          path: dist/bazi/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish-core:
    name: Publish py-ephemeris to PyPI
    needs:
      - wheels
      - source-distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download py-ephemeris wheels
        uses: actions/download-artifact@v8
        with:
          pattern: core-wheels-*
          path: dist
          merge-multiple: true

      - name: Download py-ephemeris source distribution
        uses: actions/download-artifact@v8
        with:
          name: core-sdist
          path: dist

      - name: Verify py-ephemeris release files
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 37
          find dist -maxdepth 1 -type f -print | sort

      - name: Publish py-ephemeris distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-bazi:
    name: Publish py-ephemeris-bazi to PyPI
    needs:
      - wheels
      - source-distributions
      - publish-core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi-bazi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download py-ephemeris-bazi wheels
        uses: actions/download-artifact@v8
        with:
          pattern: bazi-wheels-*
          path: dist
          merge-multiple: true

      - name: Download py-ephemeris-bazi source distribution
        uses: actions/download-artifact@v8
        with:
          name: bazi-sdist
          path: dist

      - name: Verify py-ephemeris-bazi release files
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 37
          find dist -maxdepth 1 -type f -print | sort

      - name: Publish py-ephemeris-bazi distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
