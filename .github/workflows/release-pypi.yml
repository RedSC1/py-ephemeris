name: Release Python distributions to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: pypi-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Match package versions to tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          roots = [
              pathlib.Path("pyproject.toml"),
              pathlib.Path("packages/taiyin-bazi/pyproject.toml"),
              pathlib.Path("packages/taiyin-ziwei/pyproject.toml"),
          ]
          versions = [
              tomllib.loads(path.read_text(encoding="utf-8"))["project"]["version"]
              for path in roots
          ]
          if len(set(versions)) != 1:
              raise SystemExit(f"package versions differ: {versions}")
          expected_tag = f"v{versions[0]}"
          if os.environ["RELEASE_TAG"] != expected_tag:
              raise SystemExit(
                  f"release tag {os.environ['RELEASE_TAG']!r} does not match "
                  f"package version; expected {expected_tag!r}"
              )
          print(f"validated release {expected_tag}")
          PY

  wheels:
    name: Wheels (${{ matrix.os }})
    needs: validate-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
          - macos-15-intel
          - macos-14
    env:
      CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
      CIBW_SKIP: "*-musllinux_* *-win32"
      CIBW_ARCHS: auto64
      CIBW_CONFIG_SETTINGS: >-
        cmake.define.TAIYIN_SOURCE_DIR={project}/taiyin-ephemeris

    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out pinned Taiyin C++ core
        uses: actions/checkout@v7
        with:
          repository: RedSC1/taiyin-ephemeris
          # Pinned public Taiyin C++ core; do not follow a moving branch.
          ref: v1.0.0-beta.8
          path: taiyin-ephemeris
          persist-credentials: false

      - name: Set up host Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Release win_amd64 wheels use MinGW-w64 GCC.
      - name: Set up MinGW-w64 GCC for Windows x64 wheels
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja

      - name: Select MinGW-w64 GCC for Windows x64 wheels
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: >-
          'CIBW_ENVIRONMENT_WINDOWS=PATH="C:\\msys64\\mingw64\\bin;$PATH" CC=gcc CXX=g++ CMAKE_GENERATOR=Ninja'
          | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # GCC has no native Windows ARM64 toolchain. llvm-mingw supplies a
      # native ARM64 Clang/LLD MinGW-w64 toolchain, including the UCRT sysroot.
      - name: Install pinned llvm-mingw for Windows ARM64 wheels
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $version = '20260616'
          $root = Join-Path $env:RUNNER_TEMP "llvm-mingw-$version-ucrt-aarch64"
          $archive = Join-Path $env:RUNNER_TEMP "llvm-mingw-$version-ucrt-aarch64.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/$version/llvm-mingw-$version-ucrt-aarch64.zip" `
            -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $env:RUNNER_TEMP -Force
          if (!(Test-Path (Join-Path $root 'bin/aarch64-w64-mingw32-clang.exe'))) {
            throw "llvm-mingw ARM64 compiler was not extracted at $root"
          }
          "TAIYIN_LLVM_MINGW_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Select llvm-mingw Clang for Windows ARM64 wheels
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: >-
          'CIBW_ENVIRONMENT_WINDOWS=PATH="$TAIYIN_LLVM_MINGW_ROOT\\bin;$PATH" CC=$TAIYIN_LLVM_MINGW_ROOT\\bin\\aarch64-w64-mingw32-clang.exe CXX=$TAIYIN_LLVM_MINGW_ROOT\\bin\\aarch64-w64-mingw32-clang++.exe CMAKE_GENERATOR=Ninja'
          | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and test py-ephemeris wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_TEST_COMMAND: >-
            python -c "import math, taiyin;
            eph = taiyin.Ephemeris();
            ctx = eph.create_context();
            jd = taiyin.JulianDate.from_double(2460310.5);
            coordinates, result_flags = ctx.position.at_ut1(
            taiyin.Body.mars, jd);
            assert math.isfinite(coordinates[0]);
            assert int(result_flags) >= 0"
        with:
          package-dir: .
          output-dir: wheelhouse/core

      - name: Build and test py-ephemeris-bazi wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_CONFIG_SETTINGS: >-
            cmake.define.TAIYIN_SOURCE_DIR=../../taiyin-ephemeris
          CIBW_BEFORE_TEST: >-
            python -m pip install --no-index
            --find-links "{project}/wheelhouse/core" py-ephemeris
          CIBW_TEST_COMMAND: >-
            python -c "import taiyin, taiyin_bazi;
            eph = taiyin.Ephemeris();
            ctx = eph.create_context();
            bazi = ctx.bazi();
            local = taiyin.AstroDateTime(2003, 3, 13, 14, 15);
            result, result_flags = bazi.calculate_local(
            local, gender=taiyin_bazi.BaziGender.male);
            assert type(ctx).__name__ == 'EphemerisContext';
            assert type(bazi).__name__ == 'BaziContext';
            assert result.qiyun.startAgeYears > 0;
            assert int(result_flags) >= 0"
        with:
          package-dir: packages/taiyin-bazi
          output-dir: wheelhouse/bazi

      - name: Verify py-ephemeris-bazi stays a thin extension
        run: >-
          python -c "import pathlib, zipfile;
          wheel = next(pathlib.Path('wheelhouse/bazi').glob('*.whl'));
          names = zipfile.ZipFile(wheel).namelist();
          assert wheel.stat().st_size < 1500000, wheel.stat().st_size;
          assert not any(name.startswith('taiyin/') for name in names), names"

      - name: Build and test py-ephemeris-ziwei wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_CONFIG_SETTINGS: >-
            cmake.define.TAIYIN_SOURCE_DIR=../../taiyin-ephemeris
          CIBW_BEFORE_TEST: >-
            python -m pip install --no-index
            --find-links "{project}/wheelhouse/core" py-ephemeris
          CIBW_TEST_COMMAND: >-
            python -c "import taiyin, taiyin_ziwei;
            eph = taiyin.Ephemeris();
            ctx = eph.create_context();
            ziwei = ctx.ziwei();
            local = taiyin.AstroDateTime(2003, 3, 13, 14, 15);
            chart, result_flags = ziwei.calculate_local(
            local, gender=taiyin_ziwei.ZiweiGender.male);
            assert chart.star_position(ziwei.find_star('ziwei')) is not None;
            assert int(result_flags) >= 0"
        with:
          package-dir: packages/taiyin-ziwei
          output-dir: wheelhouse/ziwei

      - name: Verify py-ephemeris-ziwei stays a thin extension
        run: >-
          python -c "import pathlib, zipfile;
          wheel = next(pathlib.Path('wheelhouse/ziwei').glob('*.whl'));
          names = zipfile.ZipFile(wheel).namelist();
          assert wheel.stat().st_size < 1500000, wheel.stat().st_size;
          assert not any(name.startswith('taiyin/') for name in names), names"

      - name: Upload py-ephemeris wheels
        uses: actions/upload-artifact@v7
        with:
          name: core-wheels-${{ matrix.os }}
          path: wheelhouse/core/*.whl
          if-no-files-found: error
          retention-days: 14

      - name: Upload py-ephemeris-bazi wheels
        uses: actions/upload-artifact@v7
        with:
          name: bazi-wheels-${{ matrix.os }}
          path: wheelhouse/bazi/*.whl
          if-no-files-found: error
          retention-days: 14

      - name: Upload py-ephemeris-ziwei wheels
        uses: actions/upload-artifact@v7
        with:
          name: ziwei-wheels-${{ matrix.os }}
          path: wheelhouse/ziwei/*.whl
          if-no-files-found: error
          retention-days: 14

  source-distributions:
    name: Source distributions
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build source distributions
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --outdir dist/core .
          python -m build --sdist --outdir dist/bazi packages/taiyin-bazi
          python -m build --sdist --outdir dist/ziwei packages/taiyin-ziwei

      - name: Upload py-ephemeris source distribution
        uses: actions/upload-artifact@v7
        with:
          name: core-sdist
          path: dist/core/*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload py-ephemeris-bazi source distribution
        uses: actions/upload-artifact@v7
        with:
          name: bazi-sdist
          path: dist/bazi/*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload py-ephemeris-ziwei source distribution
        uses: actions/upload-artifact@v7
        with:
          name: ziwei-sdist
          path: dist/ziwei/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish-core:
    name: Publish py-ephemeris to PyPI
    needs:
      - wheels
      - source-distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download py-ephemeris wheels
        uses: actions/download-artifact@v8
        with:
          pattern: core-wheels-*
          path: dist
          merge-multiple: true

      - name: Download py-ephemeris source distribution
        uses: actions/download-artifact@v8
        with:
          name: core-sdist
          path: dist

      - name: Verify py-ephemeris release files
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 37
          find dist -maxdepth 1 -type f -print | sort

      - name: Publish py-ephemeris distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-bazi:
    name: Publish py-ephemeris-bazi to PyPI
    needs:
      - wheels
      - source-distributions
      - publish-core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi-bazi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download py-ephemeris-bazi wheels
        uses: actions/download-artifact@v8
        with:
          pattern: bazi-wheels-*
          path: dist
          merge-multiple: true

      - name: Download py-ephemeris-bazi source distribution
        uses: actions/download-artifact@v8
        with:
          name: bazi-sdist
          path: dist

      - name: Verify py-ephemeris-bazi release files
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 37
          find dist -maxdepth 1 -type f -print | sort

      - name: Publish py-ephemeris-bazi distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-ziwei:
    name: Publish py-ephemeris-ziwei to PyPI
    needs:
      - wheels
      - source-distributions
      - publish-core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi-ziwei
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download py-ephemeris-ziwei wheels
        uses: actions/download-artifact@v8
        with:
          pattern: ziwei-wheels-*
          path: dist
          merge-multiple: true

      - name: Download py-ephemeris-ziwei source distribution
        uses: actions/download-artifact@v8
        with:
          name: ziwei-sdist
          path: dist

      - name: Verify py-ephemeris-ziwei release files
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 37
          find dist -maxdepth 1 -type f -print | sort

      - name: Publish py-ephemeris-ziwei distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
