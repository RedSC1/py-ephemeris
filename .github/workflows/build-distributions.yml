name: Build Python distributions

on:
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: "Publish the completed distributions to TestPyPI"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: distributions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # Current cibuildwheel runner split: native x86-64 and ARM64 builds.
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
          - macos-15-intel
          - macos-14
    env:
      CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
      CIBW_SKIP: "*-musllinux_* *-win32"
      CIBW_ARCHS: auto64
      CIBW_CONFIG_SETTINGS: >-
        cmake.define.TAIYIN_SOURCE_DIR={project}/taiyin-ephemeris

    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out pinned Taiyin C++ core
        uses: actions/checkout@v6
        with:
          repository: RedSC1/taiyin-ephemeris
          # Pinned public Taiyin C++ core; do not follow a moving branch.
          ref: v1.0.0-preview.6
          path: taiyin-ephemeris
          persist-credentials: false

      - name: Set up host Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Published x64 Windows wheels intentionally use the same MinGW-w64 GCC
      # family recommended by the C++ core.
      - name: Set up MinGW-w64 GCC for Windows x64 wheels
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja

      - name: Select MinGW-w64 GCC for Windows x64 wheels
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: >-
          'CIBW_ENVIRONMENT_WINDOWS=PATH="C:\\msys64\\mingw64\\bin;$PATH" CC=gcc CXX=g++ CMAKE_GENERATOR=Ninja'
          | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # GCC has no native Windows ARM64 toolchain. llvm-mingw supplies a
      # native ARM64 Clang/LLD MinGW-w64 toolchain, including the UCRT sysroot.
      - name: Install pinned llvm-mingw for Windows ARM64 wheels
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $version = '20260616'
          $root = Join-Path $env:RUNNER_TEMP "llvm-mingw-$version-ucrt-aarch64"
          $archive = Join-Path $env:RUNNER_TEMP "llvm-mingw-$version-ucrt-aarch64.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/$version/llvm-mingw-$version-ucrt-aarch64.zip" `
            -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $env:RUNNER_TEMP -Force
          if (!(Test-Path (Join-Path $root 'bin/aarch64-w64-mingw32-clang.exe'))) {
            throw "llvm-mingw ARM64 compiler was not extracted at $root"
          }
          "TAIYIN_LLVM_MINGW_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Select llvm-mingw Clang for Windows ARM64 wheels
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: >-
          'CIBW_ENVIRONMENT_WINDOWS=PATH="$TAIYIN_LLVM_MINGW_ROOT\\bin;$PATH" CC=$TAIYIN_LLVM_MINGW_ROOT\\bin\\aarch64-w64-mingw32-clang.exe CXX=$TAIYIN_LLVM_MINGW_ROOT\\bin\\aarch64-w64-mingw32-clang++.exe CMAKE_GENERATOR=Ninja'
          | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and test py-ephemeris wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_TEST_COMMAND: >-
            python -c "import math, taiyin;
            eph = taiyin.Ephemeris();
            ctx = eph.create_context();
            jd = taiyin.JulianDate.from_double(2460310.5);
            coordinates, result_flags = ctx.position.at_ut1(
            taiyin.Body.mars, jd);
            assert math.isfinite(coordinates[0]);
            assert int(result_flags) >= 0"
        with:
          package-dir: .
          output-dir: wheelhouse/core

      - name: Build and test py-ephemeris-bazi wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          # Config settings are resolved from this nested package directory.
          CIBW_CONFIG_SETTINGS: >-
            cmake.define.TAIYIN_SOURCE_DIR=../../taiyin-ephemeris
          CIBW_BEFORE_TEST: >-
            python -m pip install --no-index
            --find-links "{project}/wheelhouse/core" py-ephemeris
          CIBW_TEST_COMMAND: >-
            python -c "import taiyin, taiyin_bazi;
            eph = taiyin.Ephemeris();
            ctx = eph.create_context();
            bazi = ctx.bazi();
            local = taiyin.AstroDateTime(2003, 3, 13, 14, 15);
            result, result_flags = bazi.calculate_local(
            local, gender=taiyin_bazi.BaziGender.male);
            assert type(ctx).__name__ == 'EphemerisContext';
            assert type(bazi).__name__ == 'BaziContext';
            assert result.qiyun.startAgeYears > 0;
            assert int(result_flags) >= 0"
        with:
          package-dir: packages/taiyin-bazi
          output-dir: wheelhouse/bazi

      - name: Verify py-ephemeris-bazi stays a thin extension
        run: >-
          python -c "import pathlib, zipfile;
          wheel = next(pathlib.Path('wheelhouse/bazi').glob('*.whl'));
          names = zipfile.ZipFile(wheel).namelist();
          assert wheel.stat().st_size < 1500000, wheel.stat().st_size;
          assert not any(name.startswith('taiyin/') for name in names), names"

      - name: Build and test py-ephemeris-ziwei wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_CONFIG_SETTINGS: >-
            cmake.define.TAIYIN_SOURCE_DIR=../../taiyin-ephemeris
          CIBW_BEFORE_TEST: >-
            python -m pip install --no-index
            --find-links "{project}/wheelhouse/core" py-ephemeris
          CIBW_TEST_COMMAND: >-
            python -c "import taiyin, taiyin_ziwei;
            eph = taiyin.Ephemeris();
            ctx = eph.create_context();
            ziwei = ctx.ziwei();
            local = taiyin.AstroDateTime(2003, 3, 13, 14, 15);
            chart, result_flags = ziwei.calculate_local(
            local, gender=taiyin_ziwei.ZiweiGender.male);
            assert chart.star_position(ziwei.find_star('ziwei')) is not None;
            assert int(result_flags) >= 0"
        with:
          package-dir: packages/taiyin-ziwei
          output-dir: wheelhouse/ziwei

      - name: Verify py-ephemeris-ziwei stays a thin extension
        run: >-
          python -c "import pathlib, zipfile;
          wheel = next(pathlib.Path('wheelhouse/ziwei').glob('*.whl'));
          names = zipfile.ZipFile(wheel).namelist();
          assert wheel.stat().st_size < 1500000, wheel.stat().st_size;
          assert not any(name.startswith('taiyin/') for name in names), names"

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/**/*.whl
          if-no-files-found: error
          retention-days: 14

  source-distributions:
    name: Source distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build sdists
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --outdir dist/core .
          python -m build --sdist --outdir dist/bazi packages/taiyin-bazi
          python -m build --sdist --outdir dist/ziwei packages/taiyin-ziwei

      - name: Upload source distributions
        uses: actions/upload-artifact@v6
        with:
          name: source-distributions
          path: dist/**/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish-testpypi-core:
    name: Publish py-ephemeris to TestPyPI
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.publish_testpypi
    needs:
      - wheels
      - source-distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: testpypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: downloaded-distributions
          merge-multiple: true

      - name: Download source distributions
        uses: actions/download-artifact@v8
        with:
          name: source-distributions
          path: downloaded-distributions

      - name: Collect py-ephemeris distributions
        shell: bash
        run: |
          mkdir -p dist
          find downloaded-distributions -type f \
            \( -name 'py_ephemeris-*.whl' -o -name 'py_ephemeris-*.tar.gz' \) \
            -exec cp '{}' dist/ \;
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 37
          find dist -maxdepth 1 -type f -print | sort

      - name: Publish py-ephemeris distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  publish-testpypi-bazi:
    name: Publish py-ephemeris-bazi to TestPyPI
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.publish_testpypi
    needs:
      - wheels
      - source-distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: testpypi-bazi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: downloaded-distributions
          merge-multiple: true

      - name: Download source distributions
        uses: actions/download-artifact@v8
        with:
          name: source-distributions
          path: downloaded-distributions

      - name: Collect py-ephemeris-bazi distributions
        shell: bash
        run: |
          mkdir -p dist
          find downloaded-distributions -type f \
            \( -name 'py_ephemeris_bazi-*.whl' -o -name 'py_ephemeris_bazi-*.tar.gz' \) \
            -exec cp '{}' dist/ \;
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 37
          find dist -maxdepth 1 -type f -print | sort

      - name: Publish py-ephemeris-bazi distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  publish-testpypi-ziwei:
    name: Publish py-ephemeris-ziwei to TestPyPI
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.publish_testpypi
    needs:
      - wheels
      - source-distributions
      - publish-testpypi-core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: testpypi-ziwei
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: downloaded-distributions
          merge-multiple: true

      - name: Download source distributions
        uses: actions/download-artifact@v8
        with:
          name: source-distributions
          path: downloaded-distributions

      - name: Collect py-ephemeris-ziwei distributions
        shell: bash
        run: |
          mkdir -p dist
          find downloaded-distributions -type f \
            \( -name 'py_ephemeris_ziwei-*.whl' -o -name 'py_ephemeris_ziwei-*.tar.gz' \) \
            -exec cp '{}' dist/ \;
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 37
          find dist -maxdepth 1 -type f -print | sort

      - name: Publish py-ephemeris-ziwei distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
